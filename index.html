<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎸</text></svg>"
    />
    <title>GuitAI — Afinador y acordes</title>
  </head>
  <body>
    <div id="app">
      <nav class="app-nav" aria-label="Módulos de GuitAI">
        <button type="button" class="nav-btn active" data-view="tuner">🎛️ Afinador</button>
        <button type="button" class="nav-btn" data-view="chords">🎸 Acordes</button>
      </nav>

      <!-- ======================= MÓDULO 1 · AFINADOR ======================= -->
      <section id="view-tuner">
        <header class="tuner-bar">
          <div class="brand">
            <span class="brand-mark">🎸</span>
            <div class="brand-text">
              <h1>GuitAI</h1>
              <span class="brand-sub">Afinador</span>
            </div>
          </div>
          <div class="tuner-actions">
            <select id="tuning-select" class="select-pill" title="Afinación"></select>
            <button id="sound-button" class="icon-btn" type="button" title="Sonido de confirmación" aria-pressed="true">🔔</button>
            <button id="mic-button" class="btn btn-primary" type="button">Iniciar</button>
          </div>
        </header>

        <section class="tuner-stage" id="tuner-stage">
          <div id="strings-row" class="pegs" role="group" aria-label="Cuerdas de la guitarra"></div>

          <div class="gauge" id="meter">
            <div id="gauge-host" class="gauge-host"></div>
            <div class="gauge-readout">
              <div id="note-name" class="note-name" data-state="idle">&mdash;</div>
              <div id="cents-readout" class="cents mono">&plusmn;0 &cent;</div>
              <div class="freq-line">
                <span id="detected-freq" class="mono">--.-</span><span class="unit">Hz</span>
                <span class="sep">&middot;</span>
                <span id="target-freq" class="mono">--.-</span><span class="unit">Hz</span>
              </div>
            </div>
          </div>

          <div id="verdict" class="verdict" data-state="idle">Toca una cuerda&hellip;</div>
        </section>

        <footer class="tuner-foot">
          <span id="status-text" class="status-text">Pulsa Iniciar</span>
          <div class="level-track"><div id="level-fill" class="level-fill"></div></div>
        </footer>
      </section>

      <!-- ==================== MÓDULO 2 · APRENDE ACORDES ==================== -->
      <section id="view-chords" hidden>
        <!-- Home: camino de aprendizaje -->
        <div id="chords-home">
          <div class="chords-head">
            <div>
              <h1 class="chords-title">Acordes</h1>
              <p class="chords-tagline">Tu camino del 1 al 3</p>
            </div>
            <div class="chords-head-actions">
              <button id="chords-sound-button" class="icon-btn" type="button" title="Sonido de validación" aria-pressed="true">🔔</button>
              <div id="chords-progress" class="chords-progress" aria-live="polite"></div>
            </div>
          </div>
          <div id="chord-levels" class="chord-levels"></div>
        </div>

        <!-- Lección -->
        <div id="chord-lesson" hidden>
          <div class="lesson-top">
            <button id="chord-lesson-back" class="btn btn-ghost back-btn" type="button" aria-label="Volver">&larr;</button>
            <div class="lesson-title" id="chord-lesson-title"></div>
            <div id="chord-lesson-context" class="lesson-context"></div>
            <div class="lesson-top-spacer"></div>
            <div id="chord-lesson-progress" class="chords-progress" aria-live="polite"></div>
          </div>

          <div class="lesson-layout">
            <!-- Héroe: diagrama grande -->
            <div class="card hero-panel">
              <div id="chord-diagram" class="chord-diagram" aria-label="Diagrama del acorde"></div>
              <div class="hero-name" id="chord-name"></div>
              <div id="chord-notes" class="chord-notes"></div>
            </div>

            <!-- Lateral: datos y modos -->
            <div class="card side-panel">
              <div id="chord-facts" class="chord-facts"></div>
              <details id="chord-howto-details" class="chord-details">
                <summary>👆 Cómo se hace</summary>
                <ol id="chord-howto" class="chord-howto"></ol>
              </details>
              <details id="chord-tips" class="chord-details">
                <summary>💡 Consejos</summary>
                <div id="chord-tips-body"></div>
              </details>

              <div class="mode-title">Valida el acorde</div>
              <div class="mode-row">
                <button id="mode-strum" class="btn btn-primary btn-mode" type="button">
                  <span class="mode-emoji">🎸</span>
                  <span class="mode-label">Rasgueo</span>
                  <span class="mode-sub">respuesta rápida</span>
                </button>
                <button id="mode-arpeggio" class="btn btn-secondary btn-mode" type="button">
                  <span class="mode-emoji">🎵</span>
                  <span class="mode-label">Cuerda a cuerda</span>
                  <span class="mode-sub">precisión</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Cuerda a cuerda -->
          <div id="practice" class="card practice-card" hidden>
            <div class="practice-top">
              <button id="practice-close" class="btn btn-ghost back-btn" type="button" aria-label="Cerrar práctica">&times;</button>
              <span class="practice-mode-tag">🎵 Cuerda a cuerda</span>
              <span id="practice-mic-status" class="practice-mic-status"></span>
              <button id="practice-mic-button" class="btn btn-primary" type="button">Iniciar micrófono</button>
            </div>

            <div class="practice-stage">
              <div id="practice-diagram" class="practice-diagram"></div>
              <div id="practice-prompt" class="practice-prompt"></div>
            </div>

            <div id="practice-steps" class="practice-steps" role="list"></div>
            <div id="practice-feedback" class="practice-feedback" hidden></div>

            <div class="practice-actions">
              <button id="practice-force" class="btn btn-ghost" type="button" hidden>Ya la toqué &rarr;</button>
              <button id="practice-skip" class="btn btn-ghost" type="button" hidden>Saltar cuerda</button>
            </div>

            <div id="practice-done" class="practice-done" hidden>
              <div id="practice-done-text" class="practice-done-text"></div>
              <div class="practice-done-actions">
                <button id="practice-repeat" class="btn btn-primary" type="button">Repetir</button>
                <button id="practice-next" class="btn btn-primary" type="button" hidden></button>
                <button id="practice-finish" class="btn btn-ghost" type="button">Lista</button>
              </div>
            </div>
          </div>

          <!-- Rasgueo -->
          <div id="practice-strum" class="card practice-card strum-card" hidden>
            <div class="practice-top">
              <button id="strum-close" class="btn btn-ghost back-btn" type="button" aria-label="Cerrar rasgueo">&times;</button>
              <span class="practice-mode-tag">🎸 Rasgueo</span>
              <span id="strum-mic-status" class="practice-mic-status"></span>
              <button id="strum-mic-button" class="btn btn-primary" type="button">Iniciar micrófono</button>
            </div>

            <div class="strum-layout">
              <div id="strum-diagram" class="practice-diagram strum-diagram"></div>
              <div class="strum-stage" id="strum-stage">
                <div id="strum-chord-name" class="strum-chord-name"></div>
                <div id="strum-verdict" class="strum-verdict" aria-live="polite">Rasguea y mantenlo&hellip;</div>
                <div class="strum-progress"><div id="strum-progress-fill" class="strum-progress-fill"></div></div>
                <ul id="strum-issues" class="strum-issues"></ul>
              </div>
            </div>
            <div class="strum-lights" id="strum-lights" role="img" aria-label="Cuerdas detectadas"></div>

            <div class="practice-actions strum-actions">
              <button id="strum-next" class="btn btn-primary" type="button" hidden></button>
              <button id="strum-finish" class="btn btn-ghost" type="button">Lista</button>
            </div>
          </div>
        </div>
      </section>

      <footer>GuitAI &middot; afinador + acordes</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
